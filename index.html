<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一乐店长幸运大转盘</title>
<style>
  :root{
    --bg:#120a0c; --bg2:#1d1014; --panel:#20121a; --panel-2:#2a1720;
    --gold:#f6c453; --gold-2:#ffdf9e; --red:#e2434f; --red-2:#ff6b74;
    --ink:#fff6e8; --muted:#b99c93; --line:rgba(246,196,83,.22);
    --shadow:0 18px 44px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    background:
      radial-gradient(1200px 700px at 18% -10%, rgba(226,67,79,.28), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(246,196,83,.16), transparent 55%),
      radial-gradient(900px 900px at 50% 120%, rgba(120,40,60,.35), transparent 60%),
      var(--bg);
    min-height:100vh; display:flex; flex-direction:column;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.06; z-index:0;
    background-image:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px);
  }
  header{padding:22px 26px 8px; display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; position:relative; z-index:1}
  .brand h1{
    margin:0; font-size:clamp(22px,3.2vw,34px); letter-spacing:2px; font-weight:900;
    background:linear-gradient(180deg,#fff2cf,#f6c453 55%,#e08b2a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 18px rgba(246,196,83,.25);
  }
  .brand p{margin:6px 0 0; color:var(--muted); font-size:13px; letter-spacing:1px}
  .header-actions{margin-left:auto; display:flex; gap:10px; align-items:center}
  .chip{
    border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--muted);
    border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer;
    transition:.2s; user-select:none;
  }
  .chip:hover{color:var(--gold-2); border-color:rgba(246,196,83,.5); background:rgba(246,196,83,.08)}
  .chip.on{color:#231204; background:linear-gradient(180deg,var(--gold-2),var(--gold)); border-color:transparent; font-weight:700}

  main{flex:1; display:grid; grid-template-columns:250px minmax(0,1fr) 300px; gap:18px; padding:14px 26px 26px; align-items:start; position:relative; z-index:1}

  /* ---------- level list ---------- */
  .levels{
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow);
    max-height:calc(100vh - 140px); overflow:auto;
  }
  .levels h2{margin:2px 4px 10px; font-size:13px; color:var(--muted); letter-spacing:2px; font-weight:600}
  .level-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .lv{
    position:relative; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03);
    color:var(--ink); border-radius:12px; padding:9px 4px 7px; cursor:pointer; text-align:center;
    transition:.18s; font-family:inherit;
  }
  .lv b{display:block; font-size:16px; line-height:1.1}
  .lv small{display:block; font-size:10px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums}
  .lv:hover{transform:translateY(-1px); border-color:rgba(246,196,83,.45); background:rgba(246,196,83,.08)}
  .lv.active{
    border-color:transparent; background:linear-gradient(180deg,var(--red-2),var(--red));
    box-shadow:0 8px 22px rgba(226,67,79,.35); color:#fff;
  }
  .lv.active small{color:rgba(255,255,255,.85)}
  .lv.empty{opacity:.42; cursor:not-allowed}
  .lv .tag{position:absolute; top:-6px; right:-4px; font-size:9px; padding:1px 5px; border-radius:6px; background:var(--gold); color:#2a1406; font-weight:700}
  .lv.general{grid-column:span 3; background:rgba(246,196,83,.06); border-color:rgba(246,196,83,.22)}
  .lv.general.active{background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#2a1406}
  .lv.general.active small{color:#5c3a10}

  /* ---------- stage ---------- */
  .stage{display:flex; flex-direction:column; align-items:center; gap:16px; min-width:0}
  .stage-head{text-align:center}
  .stage-head .lv-name{font-size:15px; color:var(--gold-2); letter-spacing:3px; font-weight:700}
  .stage-head .lv-sub{font-size:12px; color:var(--muted); margin-top:4px}
  .wheel-wrap{position:relative; width:min(560px, 52vh, 100%); aspect-ratio:1/1; margin-top:2px}
  .wheel-wrap::after{
    content:""; position:absolute; inset:-10px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(246,196,83,.12), transparent 70%);
    filter:blur(8px); z-index:0; pointer-events:none;
  }
  canvas#wheel{position:relative; z-index:1; width:100%; height:100%; display:block; filter:drop-shadow(0 16px 30px rgba(0,0,0,.5))}
  .pointer{
    position:absolute; left:50%; top:-16px; transform:translateX(-50%); z-index:3; width:46px; height:64px;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));
  }
  .hub-btn{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2;
    width:22%; aspect-ratio:1/1; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ffe9b8, #f6c453 45%, #c9871f 100%);
    color:#3a1d06; font-weight:900; font-size:clamp(13px,1.6vw,18px); letter-spacing:2px;
    box-shadow:0 0 0 6px rgba(18,10,12,.9), 0 0 0 8px rgba(246,196,83,.25), 0 12px 26px rgba(0,0,0,.5);
    transition:.15s; font-family:inherit;
  }
  .hub-btn:hover{transform:translate(-50%,-50%) scale(1.05)}
  .hub-btn:active{transform:translate(-50%,-50%) scale(.96)}
  .hub-btn[disabled]{filter:grayscale(.5) brightness(.8); cursor:default}

  .primary{
    border:none; border-radius:999px; padding:14px 44px; font-size:17px; font-weight:800; letter-spacing:3px;
    color:#2b1408; background:linear-gradient(180deg,#ffe7ae,var(--gold) 60%,#d98d20);
    box-shadow:0 12px 26px rgba(246,196,83,.25), inset 0 1px 0 rgba(255,255,255,.6);
    cursor:pointer; transition:.15s; font-family:inherit;
  }
  .primary:hover{transform:translateY(-1px); box-shadow:0 16px 30px rgba(246,196,83,.32)}
  .primary:active{transform:translateY(1px)}
  .primary[disabled]{opacity:.5; cursor:default; transform:none}
  .hint{font-size:12px; color:var(--muted)}
  kbd{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); border-radius:6px; padding:1px 6px; font-size:11px}

  /* ---------- result & history ---------- */
  .side{display:flex; flex-direction:column; gap:16px; min-width:0}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 12px; font-size:13px; letter-spacing:2px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:8px}
  .card h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--red-2);box-shadow:0 0 10px var(--red-2)}
  #result{min-height:92px; display:flex; flex-direction:column; justify-content:center; gap:6px}
  #result .lvline{font-size:11px; color:var(--gold); letter-spacing:2px}
  #result .txt{font-size:clamp(18px,2vw,24px); font-weight:900; line-height:1.35; word-break:break-all}
  #result .empty{color:var(--muted); font-size:13px; font-weight:400}
  #result .pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .result-actions{display:flex; gap:8px; margin-top:12px}
  .result-actions .chip{flex:1; text-align:center}
  .history{max-height:340px; overflow:auto; display:flex; flex-direction:column; gap:8px}
  .hitem{
    display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:12px;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.05);
  }
  .hitem .idx{font-size:11px; color:var(--muted); min-width:18px; padding-top:2px; font-variant-numeric:tabular-nums}
  .hitem .h-lv{font-size:10px; color:var(--gold); letter-spacing:1px}
  .hitem .h-txt{font-size:13px; line-height:1.4; word-break:break-all}
  .history-empty{color:var(--muted); font-size:13px; padding:8px 2px}
  footer{padding:0 26px 20px; color:var(--muted); font-size:12px; letter-spacing:1px; position:relative; z-index:1}
  footer a{color:var(--gold-2); text-decoration:none}

  @media (max-width:1180px){
    main{grid-template-columns:210px minmax(0,1fr);}
    .side{grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr; align-items:start}
  }
  @media (max-width:760px){
    main{grid-template-columns:1fr; padding:10px 14px 20px}
    .levels{max-height:none; order:2}
    .stage{order:1}
    .side{grid-template-columns:1fr}
    .header-actions{margin-left:0}
  }

  /* ---------- actions row + options modal ---------- */
  .stage-actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center}
  .ghost{
    border:1px solid rgba(246,196,83,.35); background:rgba(246,196,83,.06); color:var(--gold-2);
    border-radius:999px; padding:12px 22px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
    transition:.2s;
  }
  .ghost:hover{background:rgba(246,196,83,.14); border-color:rgba(246,196,83,.6); transform:translateY(-1px)}
  .modal{position:fixed; inset:0; z-index:50; background:rgba(8,4,5,.72); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:24px}
  .modal[hidden]{display:none}
  .modal-card{
    width:min(900px, 96vw); max-height:84vh; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#221215,#150b0d); border:1px solid rgba(246,196,83,.28); border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.6); overflow:hidden;
  }
  .modal-head{display:flex; align-items:center; gap:12px; padding:16px 20px 12px; border-bottom:1px solid rgba(255,255,255,.07); flex-wrap:wrap}
  .modal-head h3{margin:0; font-size:16px; letter-spacing:2px; color:var(--gold-2)}
  .modal-head .muted{font-size:12px; color:var(--muted)}
  .modal-head .spacer{flex:1}
  .modal-head .chip{padding:6px 12px; font-size:12px}
  .modal-search{margin:12px 20px 0; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:var(--ink); border-radius:10px; padding:10px 14px; font-size:14px; font-family:inherit; outline:none}
  .modal-search:focus{border-color:rgba(246,196,83,.55)}
  .opt-grid{padding:14px 20px 20px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:8px}
  .opt{display:flex; gap:8px; align-items:baseline; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:8px 10px; font-size:13px; line-height:1.5}
  .opt-no{color:var(--muted); font-size:11px; min-width:2em; text-align:right; font-variant-numeric:tabular-nums; flex:none}
  .opt-txt{color:var(--ink); word-break:break-all}
  .opt-empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:30px}
  body.modal-open{overflow:hidden}

</style>
</head>

<header>
  <div class="brand">

<main>

    <div class="card">

    </div>
  </div>
</main>

<div class="modal" id="listModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="listTitle">本关全部选项</h3>
      <span class="muted" id="listCount"></span>
      <span class="spacer"></span>
      <button class="chip" id="listCopy">复制全部</button>
      <button class="chip" id="listClose">关闭</button>
    </div>
    <input class="modal-search" id="listSearch" placeholder="搜索本关选项…" autocomplete="off">
    <div class="opt-grid" id="listBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById('wheel-data').textContent);
  const TABS = [{key:'pre', level:0, title:'通用', tag:'', entries:DATA.pre, count:DATA.pre.length}]
    .concat(DATA.levels.map(lv => {
      const suffix = String(lv.title || '').replace(/^第[一二三四五六七八九十两]+关/, '').trim();
      return {key:'L'+lv.level, level:lv.level, title:'第'+lv.level+'关', subtitle:suffix,
              tag: suffix.indexOf('复制') >= 0 ? '复制' : (suffix ? '轮回' : ''),
              entries:lv.entries, count:lv.count};
    }));
  const total = DATA.total_entries;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('footCount').textContent = '共 ' + DATA.levels.length + ' 关、' + total + ' 个选项';

  const COLORS = ['#e2434f','#f6c453','#3f8f7d','#c96b3a','#8957a8','#d8a03c','#4a7fb5','#b5445f',
                  '#5aa0a0','#c98a2c','#7a6bb5','#a63d4b','#3d6f9e','#bf6a94','#8c8f3f','#d06d3a'];
  function luminance(hex){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 0.299*r + 0.587*g + 0.114*b;
  }
  const $ = s => document.querySelector(s);
  const grid = $('#levelGrid'), canvas = $('#wheel'), ctx = canvas.getContext('2d');
  const stageLevel = $('#stageLevel'), stageSub = $('#stageSub');
  const resultBox = $('#result'), historyBox = $('#history');
  const spinBtn = $('#spinBtn'), hubBtn = $('#hubBtn'), soundBtn = $('#soundBtn');
  const STORE_KEY = 'yile-wheel-v1';

  let curTab = TABS[0];
  let rotation = -Math.PI/2;
  let spinning = false;
  let soundOn = true;
  let audioCtx = null;
  let history = [];
  let lastTick = -1;
  let cssSize = 560;

  /* ---------- persistence ---------- */
  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        const s = JSON.parse(raw);
        if(Array.isArray(s.history)) history = s.history.slice(0, 200);
        if(typeof s.soundOn === 'boolean') soundOn = s.soundOn;
        const found = TABS.find(t => t.key === s.tabKey);
        if(found) curTab = found;
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify({history:history.slice(0,200), soundOn, tabKey:curTab.key})); }catch(e){}
  }

  /* ---------- UI: levels ---------- */
  function buildGrid(){
    grid.innerHTML = '';
    // 通用
    const g = document.createElement('button');
    g.className = 'lv general' + (curTab.key==='pre' ? ' active' : '');
    g.innerHTML = '<b>通用</b><small>' + DATA.pre.length + ' 项</small>';
    g.addEventListener('click', () => selectTab(TABS[0]));
    grid.appendChild(g);

    TABS.slice(1).forEach(t => {
      const b = document.createElement('button');
      const empty = t.count === 0;
      b.className = 'lv' + (t.key===curTab.key ? ' active' : '') + (empty ? ' empty' : '');
      b.innerHTML = '<b>' + t.level + '</b><small>' + (empty ? '无选项' : t.count + ' 项') + '</small>'
        + (t.tag ? '<span class="tag">' + t.tag + '</span>' : '');
      if(empty){ b.title = '原文档中该关没有列出选项'; }
      else b.addEventListener('click', () => selectTab(t));
      grid.appendChild(b);
    });
  }

  function selectTab(t){
    if(t.count === 0){ return; }
    curTab = t;
    buildGrid();
    stageLevel.textContent = t.level === 0 ? '通用' : ('第 ' + t.level + ' 关');
    stageSub.textContent = t.level === 0
      ? '文档开头列出的通用选项 · ' + t.count + ' 项'
      : (t.tag ? t.tag + '关 · ' : '') + t.count + ' 项' + (t.count > 32 ? ' · 选项较多，仅显示扇区' : '');
    resultBox.innerHTML = '<span class="empty">点击「开始抽取」转动转盘</span>';
    rotation = -Math.PI/2;
    draw();
    save();
  }

  /* ---------- geometry ---------- */
  function resize(){
    const wrap = canvas.parentElement;
    const rect = wrap.getBoundingClientRect();
    cssSize = Math.max(220, Math.min(rect.width, rect.height || rect.width));
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    draw();
  }

  function wheelRadius(){ return cssSize/2 - 16; }

  function draw(){
    const n = curTab.entries.length;
    const R = wheelRadius();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const cx = cssSize/2, cy = cssSize/2;
    ctx.save();
    ctx.translate(cx, cy);

    // rim
    ctx.beginPath(); ctx.arc(0,0,R+7,0,Math.PI*2);
    ctx.fillStyle = 'rgba(246,196,83,.16)'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,R+2,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(246,196,83,.55)'; ctx.lineWidth = 3; ctx.stroke();

    ctx.rotate(rotation);

    if(n === 0){
      ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2);
      ctx.fillStyle = '#291319'; ctx.fill();
    } else {
      const seg = Math.PI*2/n;
      for(let i=0;i<n;i++){
        const a0 = i*seg, a1 = a0+seg;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.globalAlpha = (i % 2 === 0) ? .92 : .78;
        ctx.fill();
        ctx.globalAlpha = 1;
        if(n <= 32){
          ctx.strokeStyle = 'rgba(18,10,12,.35)'; ctx.lineWidth = 1; ctx.stroke();
        }
      }
      // labels
      if(n <= 32){
        const hub = R*0.21;
        const inner = hub + 18;
        const maxW = R - inner - 12;
        for(let i=0;i<n;i++){
          const mid = i*seg + seg/2;
          let label = curTab.entries[i];
          if(!label) continue;
          const norm = (((rotation + mid) % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
          const flip = norm > Math.PI/2 && norm < Math.PI*1.5;
          let fs = n <= 12 ? R*0.052 : (n <= 20 ? R*0.038 : R*0.030);
          fs = Math.max(10, Math.min(19, Math.round(fs)));
          ctx.save();
          ctx.rotate(flip ? mid + Math.PI : mid);
          ctx.font = '800 ' + fs + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
          while(fs > 9 && ctx.measureText(label).width > maxW){
            fs -= 1; ctx.font = '800 ' + fs + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
          }
          while(label.length > 2 && ctx.measureText(label).width > maxW){
            label = label.slice(0, -2) + '…';
          }
          const bright = luminance(COLORS[i % COLORS.length]) > 150;
          ctx.textAlign = flip ? 'right' : 'left';
          ctx.textBaseline = 'middle';
          if(bright){
            ctx.fillStyle = 'rgba(34,16,10,.95)';
            ctx.fillText(label, flip ? -inner : inner, 0);
          } else {
            ctx.fillStyle = 'rgba(255,248,235,.96)';
            ctx.lineWidth = 2.4;
            ctx.strokeStyle = 'rgba(20,10,8,.55)';
            ctx.strokeText(label, flip ? -inner : inner, 0);
            ctx.fillText(label, flip ? -inner : inner, 0);
          }
          ctx.restore();
        }
      } else {
        // many sectors: subtle tick ring
        ctx.strokeStyle = 'rgba(255,240,220,.10)'; ctx.lineWidth = 1;
        for(let i=0;i<n;i+=Math.ceil(n/120)){
          const a = i*Math.PI*2/n;
          ctx.beginPath(); ctx.moveTo(Math.cos(a)*(R-10), Math.sin(a)*(R-10)); ctx.lineTo(Math.cos(a)*R, Math.sin(a)*R); ctx.stroke();
        }
      }
    }
    ctx.restore();

    // hub circle drawn by CSS button; small rim accent
    ctx.save(); ctx.translate(cx, cy);
    if(n > 32){
      const txt = n + ' 项';
      const fs = Math.round(R*0.075);
      ctx.font = '800 ' + fs + 'px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tw = ctx.measureText(txt).width;
      const padX = fs*0.6, ph = fs*1.9, py = R*0.33;
      ctx.fillStyle = 'rgba(18,10,12,.72)';
      ctx.beginPath();
      if(ctx.roundRect){ ctx.roundRect(-tw/2 - padX, py - ph/2, tw + padX*2, ph, ph/2); }
      else { ctx.rect(-tw/2 - padX, py - ph/2, tw + padX*2, ph); }
      ctx.fill();
      ctx.fillStyle = 'rgba(255,246,232,.95)';
      ctx.fillText(txt, 0, py + 1);
    }
    ctx.restore();
  }

  /* ---------- sound ---------- */
  function tick(){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.value = 1500 + Math.random()*250;
      gain.gain.setValueAtTime(0.06, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.05);
    }catch(e){}
  }
  function fanfare(){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audioCtx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = f;
        const t = t0 + i*0.09;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.55);
      });
    }catch(e){}
  }

  /* ---------- spin ---------- */
  function spin(){
    if(spinning || curTab.entries.length === 0) return;
    spinning = true;
    spinBtn.disabled = true; hubBtn.disabled = true;
    resultBox.innerHTML = '<span class="empty">转盘转动中…</span>';
    const n = curTab.entries.length;
    const seg = Math.PI*2/n;
    const idx = Math.floor(Math.random()*n);
    const jitter = (Math.random() - 0.5) * seg * 0.55;
    const base = -Math.PI/2 - (idx + 0.5)*seg + jitter;
    let target = base;
    const turns = 5 + Math.floor(Math.random()*3);
    while(target < rotation + turns*Math.PI*2) target += Math.PI*2;

    const start = rotation;
    const delta = target - start;
    const dur = (location.search.indexOf('fast') >= 0 ? 900 : 4600) + Math.random()*1100;
    const t0 = performance.now();
    lastTick = -1;

    function frame(now){
      const p = Math.min(1, (now - t0)/dur);
      const e = 1 - Math.pow(1 - p, 4);
      rotation = start + delta*e;
      draw();
      if(n <= 120){
        const sector = Math.floor(((-Math.PI/2 - rotation + Math.PI*4) % (Math.PI*2)) / seg);
        if(sector !== lastTick){ lastTick = sector; tick(); }
      } else {
        if(Math.floor(now/45) !== lastTick){ lastTick = Math.floor(now/45); tick(); }
      }
      if(p < 1){ requestAnimationFrame(frame); }
      else { finish(idx); }
    }
    requestAnimationFrame(frame);
  }

  function finish(idx){
    spinning = false;
    spinBtn.disabled = false; hubBtn.disabled = false;
    const text = curTab.entries[idx];
    const lvLabel = curTab.level === 0 ? '通用' : ('第 ' + curTab.level + ' 关');
    resultBox.innerHTML = '<div class="lvline">' + lvLabel + ' · 结果</div>'
      + '<div class="txt pop">' + escapeHtml(text) + '</div>';
    history.unshift({ lv: curTab.level, lvLabel, text, ts: Date.now() });
    history = history.slice(0, 200);
    renderHistory();
    save();
    fanfare();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderHistory(){
    if(!history.length){ historyBox.innerHTML = '<div class="history-empty">还没有记录</div>'; return; }
    historyBox.innerHTML = history.map((h, i) =>
      '<div class="hitem"><div class="idx">' + (i+1) + '</div><div><div class="h-lv">' + h.lvLabel + '</div>'
      + '<div class="h-txt">' + escapeHtml(h.text) + '</div></div></div>').join('');
  }

  /* ---------- events ---------- */
  spinBtn.addEventListener('click', spin);
  hubBtn.addEventListener('click', spin);
  $('#againBtn').addEventListener('click', spin);
  $('#nextLevelBtn').addEventListener('click', () => {
    const i = TABS.indexOf(curTab);
    for(let k = 1; k <= TABS.length; k++){
      const t = TABS[(i + k) % TABS.length];
      if(t.count > 0){ selectTab(t); return; }
    }
  });
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.classList.toggle('on', soundOn);
    soundBtn.textContent = soundOn ? '🔊 音效' : '🔇 静音';
    save();
  });
  $('#clearBtn').addEventListener('click', () => {
    history = []; renderHistory(); save();
    resultBox.innerHTML = '<span class="empty">点击「开始抽取」转动转盘</span>';
  });
  /* ---------- options viewer ---------- */
  const listModal = $('#listModal'), listBody = $('#listBody'), listTitle = $('#listTitle'),
        listCountEl = $('#listCount'), listSearch = $('#listSearch');
  let listEntries = [];

  function esc(s){
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function renderList(){
    const q = listSearch.value.trim().toLowerCase();
    const rows = [];
    listEntries.forEach((t, i) => {
      if(!q || String(t).toLowerCase().indexOf(q) >= 0) rows.push({ t: t, i: i });
    });
    listCountEl.textContent = listEntries.length + ' 项' + (q ? ' · 匹配 ' + rows.length : '');
    listBody.innerHTML = rows.length
      ? rows.map(r => '<div class="opt"><span class="opt-no">' + (r.i + 1) + '</span><span class="opt-txt">' + esc(r.t) + '</span></div>').join('')
      : '<div class="opt-empty">没有匹配的选项</div>';
  }

  function openList(){
    listEntries = curTab.entries.slice();
    listTitle.textContent = (curTab.level === 0 ? '通用' : '第 ' + curTab.level + ' 关') + ' · 全部选项';
    listSearch.value = '';
    renderList();
    listModal.hidden = false;
    document.body.classList.add('modal-open');
    setTimeout(() => listSearch.focus(), 30);
  }

  function closeList(){
    listModal.hidden = true;
    document.body.classList.remove('modal-open');
  }

  function fallbackCopy(text, done){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    done();
  }

  $('#listBtn').addEventListener('click', openList);
  $('#listClose').addEventListener('click', closeList);
  listModal.addEventListener('click', e => { if(e.target === listModal) closeList(); });
  listSearch.addEventListener('input', renderList);
  $('#listCopy').addEventListener('click', () => {
    const text = listEntries.map((t, i) => (i + 1) + '. ' + t).join('\n');
    const btn = $('#listCopy'), old = btn.textContent;
    const done = () => { btn.textContent = '已复制 ✓'; setTimeout(() => { btn.textContent = old; }, 1200); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && !listModal.hidden){ closeList(); return; }
    if(e.code === 'Space' && !e.repeat && listModal.hidden){ e.preventDefault(); spin(); }
  });
  window.addEventListener('resize', resize);

  /* ---------- boot ---------- */
  load();
  soundBtn.classList.toggle('on', soundOn);
  soundBtn.textContent = soundOn ? '🔊 音效' : '🔇 静音';
  buildGrid();
  stageLevel.textContent = curTab.level === 0 ? '通用' : ('第 ' + curTab.level + ' 关');
  stageSub.textContent = curTab.level === 0 ? '文档开头列出的通用选项 · ' + curTab.count + ' 项'
    : (curTab.tag ? curTab.tag + '关 · ' : '') + curTab.count + ' 项';
  renderHistory();
  resize();
  /* ---------- deep link / demo: ?level=9&auto=1 | ?demo=3 ---------- */
  try{
    const q = new URLSearchParams(location.search);
    const want = q.get('level');
    if(want){
      const t = TABS.find(x => String(x.level) === want);
      if(t && t.count > 0) selectTab(t);
    }
    const demo = q.get('demo');
    if(demo !== null && !isNaN(+demo) && curTab.count > 0){
      const k = ((+demo % curTab.count) + curTab.count) % curTab.count;
      setTimeout(() => finish(k), 500);
    }
    if(q.get('auto')) setTimeout(() => spin(), 350);
    if(q.get('list')) setTimeout(openList, 400);
  } catch(e){ /* ignore */ }
})();
</script>
</body>
</html>
